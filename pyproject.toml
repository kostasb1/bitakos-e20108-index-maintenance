[project]
name = "bitakos-e20108-index-maintenance"
version = "1.0.0"
description = "Index maintenance techniques for vector data, the code of a bachelor thesis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# the job runners under results/ are kept exactly as they ran
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]  # long lines are left to the formatter
